[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serenity"
version = "0.1.0"
description = "Serenity - a privacy-first personal-secretary desktop app (Phase 1)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Berk" }]
dependencies = [
    "PySide6>=6.6",
    "dateparser>=1.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional local text-to-speech (Serenity reads her lines aloud). Not in the base
# install; the app degrades to a silent no-op engine when absent. See requirements-voice.txt.
voice = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "piper-tts>=1.4",
    "pyttsx3>=2.90; sys_platform == 'win32'",
]
# Chatterbox voice cloning (Resemble AI Chatterbox Multilingual, MIT). Heavy (PyTorch);
# pulled in only for the cloned-voice feature. The app degrades to available=False when
# absent. Separate extra so the lighter Kokoro/Piper voices do not drag in torch.
clone = [
    "chatterbox-tts>=0.1",
]
# Optional on-device 'Meaning' (semantic) search. Not in the base install; the app
# degrades to keyword 'Text' search when absent. See requirements-semantic.txt.
semantic = [
    "fastembed>=0.3",     # ONNX multilingual-e5 (no PyTorch), pulls onnxruntime
    "sqlite-vec>=0.1",    # native KNN vector search; optional fast path, pure-Python fallback if absent
]
# Optional AC-power probe for the break-time scheduler's heavy-job guard. Not in the base
# install; detect_on_ac() returns None (unknown) and heavy jobs are conservatively skipped
# when absent. See requirements-power.txt.
power = [
    "psutil>=5.9",        # cross-platform battery / power-plugged sensor; lazy-imported, optional
]

[project.scripts]
serenity = "serenity.__main__:main"

[tool.setuptools.packages.find]
include = ["serenity*"]

[tool.setuptools.package-data]
serenity = ["assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
