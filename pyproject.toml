[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serenity"
version = "0.1.0"
description = "Serenity - a privacy-first personal-secretary desktop app (Phase 1)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Berk" }]
dependencies = [
    "PySide6>=6.6",
    "dateparser>=1.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
serenity = "serenity.__main__:main"

[tool.setuptools.packages.find]
include = ["serenity*"]

[tool.setuptools.package-data]
serenity = ["assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
