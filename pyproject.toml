[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serenity"
version = "0.1.0"
description = "Serenity - a privacy-first personal-secretary desktop app (Phase 1)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Berk" }]
dependencies = [
    "PySide6>=6.6",
    "dateparser>=1.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional local text-to-speech (Serenity reads her lines aloud). Not in the base
# install; the app degrades to a silent no-op engine when absent. See requirements-voice.txt.
voice = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "piper-tts>=1.4",
    "pyttsx3>=2.90; sys_platform == 'win32'",
]

[project.scripts]
serenity = "serenity.__main__:main"

[tool.setuptools.packages.find]
include = ["serenity*"]

[tool.setuptools.package-data]
serenity = ["assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
